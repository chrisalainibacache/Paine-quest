name: HD Stage 1 texture validation

on:
  push:
    branches: [feature/hd-remaster-stage1-textures]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-texture-candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tools
        run: python -m pip install pillow numpy
      - name: Audit source textures (read-only)
        run: python tools/graphics/audit_source_textures.py
      - name: Generate isolated HD candidates
        run: python tools/graphics/hd_stage1_materials.py
      - name: Generate height and normal map candidates
        run: python tools/graphics/hd_stage1_normal_maps.py
      - name: Validate candidate structure and palette preservation
        run: python tools/graphics/validate_hd_candidates.py
      - name: Validate generated normal-map filenames and dimensions
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root = Path("artifacts/hd_stage1")
          expected = [
              "concrete_normal_512.png",
              "old_bricks_normal_512.png",
              "asphalt_cracked_normal_512.png",
              "concrete_height_512.png",
              "old_bricks_height_512.png",
              "asphalt_cracked_height_512.png",
          ]
          for name in expected:
              path = root / name
              assert path.is_file(), f"Missing generated map: {path}"
              with Image.open(path) as image:
                  assert image.size == (512, 512), f"{name}: expected 512x512, got {image.size}"
          print("All six generated height/normal maps exist at 512x512.")
          PY
      - name: Install Godot 4.7.2
        run: |
          set -e
          version="4.7.2"
          base="https://github.com/godotengine/godot/releases/download/${version}-stable"
          curl -sSL -o /tmp/godot.zip "${base}/Godot_v${version}-stable_linux.x86_64.zip"
          mkdir -p /opt/godot
          unzip -q /tmp/godot.zip -d /opt/godot
          echo "GODOT=/opt/godot/Godot_v${version}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Install software rendering for visual comparison
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Import project and validate HD shader
        run: |
          set -e
          "$GODOT" --headless --path . --import
          mkdir -p artifacts/hd_stage1
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 "$GODOT" --path . -s res://tools/graphics/validate_hd_shader.gd
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 "$GODOT" --path . -s res://tools/graphics/render_hd_comparison.gd
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 "$GODOT" --path . -s res://tools/graphics/render_hd_normal_comparison.gd
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 "$GODOT" --path . -s res://tools/graphics/render_real_station_preview.gd
      - name: Render environment texture tiling diagnostics
        run: python tools/graphics/render_texture_tiling_diagnostics.py
      - name: Validate dimensions and source preservation
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root = Path("artifacts/hd_stage1")
          expected = {
              "concrete_hd_2x.png": (512, 512),
              "bricks_old_hd_2x.png": (512, 512),
              "asphalt_cracked_hd_2x.png": (512, 512),
          }
          for name, size in expected.items():
              path = root / name
              assert path.exists(), f"Missing {path}"
              with Image.open(path) as image:
                  assert image.size == size, f"{name}: {image.size} != {size}"
          previews = ["shader_orientaciones.png", "comparacion_hd.png", "comparacion_normales_luz.png", "anden_real_camara_west.png", "anden_real_camara_east.png"]
          for name in previews:
              path = root / name
              assert path.is_file(), f"Missing visual comparison: {path}"
              with Image.open(path) as image:
                  image.load()
                  assert image.width >= 640 and image.height >= 360, (
                      f"{name}: unexpected preview size {image.size}"
                  )
                  extrema = image.convert("RGB").getextrema()
                  assert any(low != high for low, high in extrema), (
                      f"{name}: preview appears completely flat"
                  )
          tiling = root / "environment_texture_tiling_review.png"
          assert tiling.is_file(), f"Missing tiling review: {tiling}"
          with Image.open(tiling) as image:
              assert image.width >= 1000 and image.height >= 1000
          print("HD candidates and visual diagnostics: OK")
          PY
      - name: Confirm original textures remain unchanged
        run: git diff --exit-code -- assets/environment/textures/
      - name: Upload comparison set
        uses: actions/upload-artifact@v4
        with:
          name: paine-hd-stage1-textures
          path: artifacts/hd_stage1/
          retention-days: 14
