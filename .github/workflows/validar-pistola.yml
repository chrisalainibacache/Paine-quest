# Validación aislada de cambios visuales: no exporta ni publica APK.
name: Validación de pistola

on:
  push:
    branches: [feature/pistola-visual-ps1]
  pull_request:
    branches: [main]
    paths:
      - "actors/player/**"
      - "actors/enemies/**"
      - "data/enemies/**"
      - "docs/GDD.md"
      - "levels/kit/room.gd"
      - "levels/kit/interact/note.gd"
      - "systems/scene_loader.gd"
      - "ui/dialogue/**"
      - "ui/inventory/inventory_menu.gd"
      - "tools/capture_screenshots.gd"
      - "tests/**"
      - ".github/workflows/validar-pistola.yml"

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar Godot
        run: |
          set -e
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p "$HOME/godot"
          curl -sSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d "$HOME/godot"
          echo "GODOT=$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Importar el proyecto
        run: |
          "$GODOT" --headless --path . --editor --import

      - name: Pruebas automáticas
        run: |
          "$GODOT" --headless --path . -s res://tests/smoke_test.gd
          "$GODOT" --headless --path . -s res://tests/systems_test.gd
          "$GODOT" --headless --path . -s res://tests/levels_test.gd

      - name: Capturar el arma en juego y al disparar
        run: |
          mkdir -p build/pistol-preview
          xvfb-run "$GODOT" --path . --rendering-driver opengl3 -s res://tools/capture_screenshots.gd -- build/pistol-preview

      - name: Guardar capturas de revisión
        uses: actions/upload-artifact@v4
        with:
          name: paine-pistol-preview
          path: build/pistol-preview/*.png
          if-no-files-found: error
