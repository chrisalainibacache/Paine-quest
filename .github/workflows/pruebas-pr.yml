# Pruebas en cada Pull Request: así quien programa sin Godot (ChatGPT) ve si su cambio
# funciona. No publica nada. Mismas pruebas que el APK + auditoría de cámaras + paquete exportado.
name: Pruebas en PR

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Caché de Godot y plantillas
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-stable

      - name: Descargar Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -e
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          curl -sSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mv /tmp/tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Configurar editor (SDK de Android y Java)
        run: |
          echo "GODOT=$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> $GITHUB_ENV
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' \
            "$ANDROID_SDK_ROOT" "$JAVA_HOME" > ~/.config/godot/editor_settings-4.7.tres

      - name: Los .tscn coinciden con sus generadores (.py)
        run: |
          set -e
          ./tools/level_gen/regenerar_todo.sh
          if ! git diff --exit-code --stat -- levels/station levels/tracks levels/buin levels/kit/props ui; then
            echo "::error::Hay .tscn que no coinciden con su generador. Corre ./tools/level_gen/regenerar_todo.sh y sube el resultado."
            exit 1
          fi
          git checkout -- .

      - name: Importar el proyecto
        run: |
          "$GODOT" --headless --import || true
          "$GODOT" --headless --import

      - name: Pruebas automáticas
        run: |
          "$GODOT" --headless --path . -s res://tests/smoke_test.gd
          "$GODOT" --headless --path . -s res://tests/systems_test.gd
          "$GODOT" --headless --path . -s res://tests/levels_test.gd

      - name: Auditoría de cámaras (Isabella nunca fuera de cuadro ni tapada)
        run: |
          "$GODOT" --headless --path . -s res://tools/audit_cameras.gd

      - name: El paquete exportado conserva los textos
        run: |
          set -e
          mkdir -p build
          "$GODOT" --headless --export-pack "Android" build/probe.pck
          "$GODOT" --headless --main-pack build/probe.pck -s "$PWD/tools/export_probe.gd"
