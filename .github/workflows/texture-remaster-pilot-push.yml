name: Texture remaster pilot
on:
  push:
    branches:
      - feature/remaster-hd-textures-pilot
    paths:
      - "tools/graphics/remaster_texture_pilot.py"
      - ".github/workflows/texture-remaster-pilot-push.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-texture-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/remaster-hd-textures-pilot
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pillow
      - name: Generate isolated texture candidates
        run: python tools/graphics/remaster_texture_pilot.py
      - uses: actions/upload-artifact@v4
        with:
          name: paine-hd-texture-pilot
          path: artifacts/texture_pilot/
          retention-days: 14
